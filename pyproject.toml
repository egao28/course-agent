[project]
name = "course-agent"
version = "0.1.0"
description = "Hybrid retrieval (dense + BM25 + RRF) and agent layer for a UIUC course-planning assistant"
readme = "README.md"
# Single interpreter version for reproducible lock/indexes/reports. The stack also resolves on
# 3.13/3.14 today, but chromadb's onnxruntime dependency has lagged new CPython releases before,
# so stay one version behind the system Python (3.14).
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb",
    "rank-bm25",
    "openai",
    "pyyaml",
    "numpy",
    "tqdm",
    "python-dotenv",
    "tiktoken",
]

[project.optional-dependencies]
# Local embedding route (BGE-M3); heavy, install only when needed: `uv sync --extra local`
local = ["sentence-transformers"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100
# target-version is inferred from requires-python

[tool.ruff.lint]
# keep ruff defaults, add the full pycodestyle E set (incl. E501 line length)
extend-select = ["E"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
