[project]
name = "almabot"
version = "0.1.0"
description = "Hybrid retrieval (dense + BM25 + RRF) and agent layer for a UIUC course-planning assistant"
readme = "README.md"
# Single interpreter version for reproducible lock/indexes/reports. The stack also resolves on
# 3.13/3.14 today, but chromadb's onnxruntime dependency has lagged new CPython releases before,
# so stay one version behind the system Python (3.14).
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb",
    "rank-bm25",
    "openai",
    "pyyaml",
    "numpy",
    "tqdm",
    "python-dotenv",
    "tiktoken",
    # Day 2: the agent graph, the MCP server over its tools, and the schemas those tools declare.
    # pydantic already arrives transitively through chromadb and fastmcp, but the tool schemas are
    # ours, so the import belongs to a direct dependency.
    "langgraph",
    "fastmcp",
    "pydantic",
]

[project.optional-dependencies]
# Local embedding route (BGE-M3); heavy, install only when needed: `uv sync --extra local`
local = ["sentence-transformers"]
# Day 5's figures and AUROC (eval/scripts/risk_coverage.py); never imported by the agent itself:
# `uv sync --extra analysis`
analysis = ["scikit-learn", "matplotlib"]

[dependency-groups]
# The analysis extra is in dev too, so a plain `uv run pytest` runs its tests instead of skipping
# them -- `uv run` removes an extra that was not asked for.
dev = ["pytest", "ruff", "almabot[analysis]"]

[tool.ruff]
line-length = 100
# target-version is inferred from requires-python

[tool.ruff.lint]
# Ruff's defaults stay on (E4/E7/E9 + F): F is what measured 0 unused imports and 0 unused locals
# in #115's audit, and it is the rule that keeps it there. Each addition below is a finding from
# that audit, turned into something that fails the build rather than something to re-measure.
extend-select = [
    "E",    # the full pycodestyle E set, incl. E501 -- line-length 100 is enforced, not advisory
    "D1",   # every module, class and function carries a docstring (#115 wrote the 148 missing ones)
    "ERA",  # no commented-out code: the audit found 0, and this is what stops the first one
]

[tool.ruff.lint.per-file-ignores]
# The test names are the documentation here -- they are full sentences
# (`test_the_line_names_only_what_would_change`), and 1,800 of them would gain nothing from a
# docstring restating the name. D1 is enforced everywhere the *library* is read from.
"tests/*" = ["D1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
