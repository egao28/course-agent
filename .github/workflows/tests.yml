# The repo's first CI (#116), brought forward by #107: the traceability check is only a promise
# if something other than a laptop runs it.
#
# Two jobs.
#
# `tests` is the repo as it is developed, through uv. Five things are checked, in the order a
# failure is cheapest to read: the locked environment resolves at all, the generated
# requirements files still match the lock, the tree lints, the suite passes, and
# report/README.md still traces to the files it cites. One further step is not a check but the
# setup two of them need: the corpus and the lexical index are rebuilt, because they are not
# committed.
#
# `pip` is the repo as a reader without uv installs it (#116) -- stock CPython, `python -m venv`,
# `pip install -r requirements-dev.txt`, no uv anywhere in the job. A generated requirements file
# that nobody installs from is a file nobody notices is broken, and `--check` above can only ever
# run where uv already exists, which is exactly not the machine these files are for.
#
# Nothing here needs a key -- no step calls a model, and neither installer ever sees a `.env`, so
# a test that quietly depended on one would fail here rather than on a laptop where the file
# exists.
name: tests

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow builds nothing, publishes nothing and comments nowhere.
permissions:
  contents: read

# A stacked branch is force-pushed often; only the newest push per ref is worth a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 rather than the default shallow clone, because one test reads
      # `git show c9ff4de:data/courses.json` -- the 1,415 variable-credit courses GUIDELINES.md
      # rule 2 quotes -- and skips itself where git cannot answer. That commit is reachable from
      # main's first-parent history but not from a shallow clone, and a test that only ever runs
      # on a laptop is not a test. It is a pinned commit rather than a branch because #126 left
      # no branch carrying the range fields (#128).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # uv installs the interpreter `.python-version` pins (3.12), so there is no setup-python
      # step and no second place where a Python version is written down.
      # Pinned exactly: setup-uv publishes no floating v10 tag, and a workflow that cannot
      # resolve its action fails before any step of this job runs.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails if uv.lock does not match pyproject.toml, which is half of what
      # "reproducible" means here. The analysis extra is named explicitly rather than relied on:
      # `dev` already asks for almabot[analysis], so this job's counts do not depend on it (#118
      # measured both and got 2337 passed, 0 skipped either way). Neither job can skip for want of
      # it: requirements-dev.txt below is a rendering of that same dev group. A bare
      # requirements.txt install is the one that skips, and nothing here does that.
      - name: Sync the locked environment
        run: uv sync --locked --extra analysis

      # requirements*.txt are generated from uv.lock, never written; the generator re-exports and
      # diffs. Editing a version by hand fails here, which is the whole reason the files can be
      # trusted -- a pip user installs from them without ever seeing uv.lock.
      - name: The requirements files still match the lock
        run: uv run python -m scripts.export_requirements --check

      - name: Lint
        run: uv run ruff check .

      # data/{courses,prereqs,requirements}.json are committed, so the corpus and the lexical
      # index rebuild from the tree with no private CSV and no network beyond tiktoken's
      # vocabulary. Without them five test_draft_items tests fail rather than skip, and the
      # BM25 index they name (bm25_877a6610) is the one the committed runs were made against.
      - name: Rebuild the corpus and the BM25 index
        run: |
          uv run python -m ingest.chunk
          uv run python -m ingest.build_bm25

      # -rs prints the reason for every skip, so "2287 passed" never quietly becomes
      # "2286 passed, 1 skipped" with nothing in the log saying which one stopped running.
      - name: Tests
        run: uv run pytest -q -rs

      # Redundant with tests/test_final_report.py on purpose: when this fails, the log says
      # which number in the report moved and where, rather than which assertion did.
      - name: The report traces to its files
        run: uv run python -m eval.scripts.final_report --check

  # The same suite, installed the way someone without uv installs it. requirements-dev.txt rather
  # than requirements.txt because the dev group asks for `almabot[analysis]`, so that file is the
  # one whose contents equal the environment the job above tests in -- same counts, no skips,
  # pytest and ruff included. A runtime-only install (requirements.txt + pytest) leaves 114 tests
  # unable to run: Day 5's and Day 6's reach for scipy and sklearn, 47 of them in two modules
  # that importorskip and skip cleanly, and 67 in five modules that fail instead (30 failed, 37
  # errors). That is a property of the suite, not of the file -- `uv sync --locked --no-dev` plus
  # pytest produces the identical counts -- and it has no issue yet.
  pip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 for the same reason as above: one test reads a pinned commit out of git.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # python-version-file, so 3.12 is written down once, in .python-version, and this job reads
      # the same pin uv does rather than a second copy of the number.
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # A venv the interpreter makes, not one uv makes. --require-hashes is implied by the file
      # (every line carries its sha256), and it is what makes this an install of the lock rather
      # than an install of whatever the index serves today; it is passed explicitly so that a
      # future file which lost its hashes fails here instead of quietly resolving.
      - name: Install from requirements-dev.txt
        run: |
          python -m venv "$RUNNER_TEMP/pipenv"
          "$RUNNER_TEMP/pipenv/bin/pip" install --require-hashes -r requirements-dev.txt

      - name: Rebuild the corpus and the BM25 index
        run: |
          "$RUNNER_TEMP/pipenv/bin/python" -m ingest.chunk
          "$RUNNER_TEMP/pipenv/bin/python" -m ingest.build_bm25

      # No `uv run`: pytest's `pythonpath = ["."]` is what makes the modules importable, since
      # --no-emit-project keeps almabot itself out of its own requirements. The pass count here
      # and the one in `tests` are meant to be the same number, and -rs makes a new skip visible.
      - name: Tests
        run: "$RUNNER_TEMP/pipenv/bin/python -m pytest -q -rs"
